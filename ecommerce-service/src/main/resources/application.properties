spring.application.name=ecommerce-service

# JDBC sqlite url (creates mydatabase.db)
spring.datasource.url=jdbc:sqlite:mydatabase.db

# SQLite JDBC Driver class
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate Dialect for SQLite compatibility
spring.jpa.database-platform=org.hibernate.dialect.SQLiteDialect

# Automatically create update tables
spring.jpa.hibernate.ddl-auto=update

# pring sql statements in logs
spring.jpa.show-sql=true
